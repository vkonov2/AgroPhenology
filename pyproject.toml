[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-phenology"
version = "0.1.0"
description = "Reproducible retrospective degree-day validation prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
early-warning = [
  "catboost>=1.2.8,<1.3",
  "joblib>=1.4,<2",
  "optuna>=4.5,<5",
  "pyarrow>=25,<26",
  "scikit-learn>=1.9,<2",
  "scipy>=1.13,<2",
]
dev = [
  "ipykernel>=6.25",
  "jsonschema>=4.20,<5",
  "nbclient>=0.9",
  "nbformat>=5.9",
  "pytest>=7.4",
]

[project.scripts]
agro-late-blight-early-warning = "agro_phenology.early_warning_pipeline:main"
agro-late-blight-cycle2 = "agro_phenology.early_warning_cycle2_pipeline:main"
agro-late-blight-cycle3 = "agro_phenology.early_warning_cycle3_pipeline:main"
agro-late-blight-shadow = "agro_phenology.shadow_cli:main"
agro-late-blight-shadow-readiness = "agro_phenology.shadow_readiness_pipeline:main"
agro-codling-moth-early-warning = "agro_phenology.target_early_warning_pipeline:main_codling"
agro-apple-scab-early-warning = "agro_phenology.target_early_warning_pipeline:main_scab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests requiring live network access"]
